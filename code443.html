
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>443</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    background: #eef2f8;
    font-family: Arial, sans-serif;
    color: #111827;
}

.container {
    width: 100%;
    max-width: 830px;
    margin: 0 auto;
    padding: 24px;
    background: #fff;
    border: 1px solid #d1d9e6;
    border-radius: 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.badges {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
}

.badge {
    padding: 7px 10px;
    border-radius: 8px;
    background: #f0edff;
    color: #6848ff;
    font-size: 12px;
    font-weight: bold;
}

.badge.views {
    background: #f0f3f8;
    color: #4b5563;
}

h2 {
    margin: 0 0 18px;
    font-size: 23px;
    font-weight: 800;
}

.player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #080e1c;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,.24);
}

.player video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #080e1c;
}

.play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(
        ellipse at center,
        rgba(35,45,68,.65),
        rgba(8,14,28,.96)
    );
    z-index: 2;
}

.play-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: min(82%, 310px);
    min-height: 58px;
    padding: 14px 20px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(110deg, #ff414b, #e81749);
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(238,34,67,.35);
    transition: transform .15s, filter .15s;
}

.play-button:hover {
    filter: brightness(1.08);
    transform: scale(1.025);
}

.play-icon {
    width: 27px;
    height: 27px;
    border: 2px solid white;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
}

.play-overlay.hidden {
    display: none;
}

.note {
    margin: 15px 0 0;
    color: #8994a8;
    font-size: 12px;
    text-align: center;
}

/* Additional button below the video player */
.bottom-button {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(110deg, #ff414b, #e81749);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(238,34,67,.25);
    transition: filter .2s, transform .2s;
}

.bottom-button:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
}

@media (max-width: 600px) {
    body {
        padding: 12px 8px;
    }

    .container {
        padding: 14px;
        border-radius: 18px;
    }

    h2 {
        font-size: 20px;
        margin-bottom: 14px;
    }

    .player {
        border-radius: 10px;
    }

    .play-button {
        width: 84%;
        min-height: 48px;
        padding: 12px;
        gap: 9px;
        font-size: 14px;
        border-radius: 12px;
    }

    .play-icon {
        width: 24px;
        height: 24px;
    }

    .bottom-button {
        margin-top: 14px;
        padding: 14px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>443</h2>

    <div class="player">

        <video id="video" playsinline controls preload="metadata">
            <source src="https://vc.zpi.cx/11/ohT1SMp.mp4" type="video/mp4">
            Your browser does not support HTML video.
        </video>

        <div class="play-overlay" id="overlay">
            <button class="play-button" id="playButton" type="button">
                <span class="play-icon">▶</span>
                <span>Click to Play Video</span>
            </button>
        </div>

    </div>

   

</div>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const playButton = document.getElementById("playButton");

let adOpened = false;

playButton.addEventListener("click", function () {

    // Original Play button ad behavior remains unchanged.
    if (!adOpened) {
        adOpened = true;

        const adTab = window.open(
            "https://uplcm.com/4/8236017",
            "_blank",
            "noopener"
        );
    }

    overlay.classList.add("hidden");

    video.play().catch(function () {
        overlay.classList.remove("hidden");
    });

});

// Original video event behavior remains unchanged.
video.addEventListener("ended", function () {
    overlay.classList.remove("hidden");
});

video.addEventListener("playing", function () {
    overlay.classList.add("hidden");
});
</script>

</body>
</html>
